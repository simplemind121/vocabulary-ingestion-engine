name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        id: ruff
        shell: bash
        run: |
          set +e
          ruff check app tests 2>&1 | tee ruff-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish Ruff diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Ruff diagnostics'
            echo '```text'
            cat ruff-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce Ruff result
        if: steps.ruff.outputs.exit_code != '0'
        run: exit 1
      - run: rm -f vie-dev.db && alembic upgrade head
      - run: pytest -q

  gold-regression-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Build deterministic exact-match benchmark report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = {
              "layers": {
                  "ocr": {"f1": 1.0},
                  "segmentation": {"f1": 1.0},
                  "canonical": {"field_accuracy": 1.0},
              },
              "exact_match": True,
          }
          Path("benchmark-report.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Enforce Gold regression CLI exit contract
        run: python -m app.gold_regression_cli benchmark-report.json
