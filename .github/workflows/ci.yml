name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        id: ruff
        shell: bash
        run: |
          set +e
          ruff check app tests 2>&1 | tee ruff-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish Ruff diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Ruff diagnostics'
            echo '```text'
            cat ruff-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Ruff diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Ruff result
        if: steps.ruff.outputs.exit_code != '0'
        run: exit 1
      - run: rm -f vie-dev.db && alembic upgrade head
      - name: Pytest
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish pytest diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Pytest diagnostics'
            echo '```text'
            cat pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pytest diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce pytest result
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

  gold-corpus-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Report real Gold corpus readiness
        run: >-
          python -m app.gold_corpus_cli
          --annotations gold_samples/annotations
          --output gold-readiness.json
      - name: Validate source-bound full-book audit evidence
        run: >-
          python -m app.full_book_evidence_check_cli
          release_evidence/full-book-audit-v1.json
          --source-metadata gold_samples/source_document.json
      - name: Report Gold Source Media Fidelity (not a release pass)
        run: >-
          python -m app.gold_media_cli
          --output gold-source-media-report.json
      - name: Publish Gold readiness summary
        if: always()
        run: |
          {
            echo '## Gold corpus readiness (not a release pass)'
            echo '```json'
            cat gold-readiness.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-corpus-readiness
          path: gold-readiness.json
          if-no-files-found: error

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify the production topology
        env:
          VIE_SMOKE_EVIDENCE: ${{ github.workspace }}/production-smoke.json
        run: scripts/compose-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-evidence
          path: production-smoke.json
          if-no-files-found: warn
