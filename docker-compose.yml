services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - vie_data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg://vie:vie@postgres:5432/vie
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vie
      POSTGRES_USER: vie
      POSTGRES_PASSWORD: vie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vie -d vie"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  vie_data:
  postgres_data:
