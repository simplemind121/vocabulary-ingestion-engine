[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabulary-ingestion-engine"
version = "0.1.0a2"
description = "Traceable vocabulary database factory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "pymupdf==1.26.7",
  "openpyxl>=3.1",
  "boto3>=1.35",
  "redis>=5.0",
  "celery>=5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "pillow>=11.0",
  "numpy>=2.0",
  "jsonschema>=4.23",
]
ocr-paddle = ["paddleocr>=2.9", "paddlepaddle>=3.0", "pillow>=11.0", "numpy>=2.0"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
